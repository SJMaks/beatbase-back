services:
  postgresql:
    image: postgres:18-alpine
    container_name: beatbase_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - beatbase_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always
  port_forwarder:
    image: alpine/socat:1.8.1.3
    container_name: beatbase_port_forwarder
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - socat tcp-listen:5432,fork,reuseaddr tcp-connect:beatbase_postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      postgresql:
        condition: service_healthy
    restart: always  
  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

volumes:
  beatbase_db: